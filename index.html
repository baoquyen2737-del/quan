<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | PRX</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top,#172554 0%,#050816 45%,#02030a 100%);
    color:white;
    padding:20px;
}

.profile{
    width:100%;
    max-width:420px;
    padding:30px 22px;
    text-align:center;
    border:1px solid rgba(255,255,255,.15);
    border-radius:28px;
    background:rgba(10,15,35,.72);
    backdrop-filter:blur(18px);
    box-shadow:0 0 50px rgba(0,140,255,.15);
    animation:show .8s ease;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.avatar{
    width:110px;
    height:110px;
    margin:auto;
    border-radius:50%;
    padding:4px;
    background:linear-gradient(135deg,#00d4ff,#7c3aed,#ff0080);
    box-shadow:0 0 30px rgba(0,212,255,.35);
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    background:#111827;
}

h1{
    margin-top:18px;
    font-size:28px;
}

.username{
    color:#8b9bb4;
    margin-top:5px;
}

.bio{
    margin:18px 0;
    line-height:1.6;
    color:#dbe4f0;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 13px;
    border-radius:20px;
    background:rgba(34,197,94,.12);
    color:#4ade80;
    font-size:13px;
    margin-bottom:18px;
}

.dot{
    width:8px;
    height:8px;
    background:#22c55e;
    border-radius:50%;
    box-shadow:0 0 10px #22c55e;
}

.links{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.links a{
    text-decoration:none;
    color:white;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.08);
    transition:.25s;
    font-weight:bold;
}

.links a:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.13);
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:20px 0;
}

.stat{
    padding:13px 5px;
    border-radius:15px;
    background:rgba(255,255,255,.05);
}

.stat b{
    display:block;
    font-size:19px;
}

.stat span{
    font-size:11px;
    color:#8b9bb4;
}

footer{
    margin-top:22px;
    font-size:12px;
    color:#64748b;
}
</style>
</head>

<body>

<div class="profile">

    <!-- ĐỔI LINK ẢNH AVATAR Ở ĐÂY -->
    <div class="avatar">
        <img src="https://i.imgur.com/8Km9tLL.png" alt="Avatar">
    </div>

    <!-- TÊN -->
    <h1>PRX</h1>

    <!-- USERNAME -->
    <div class="username">@prx_official</div>

    <br>

    <div class="status">
        <span class="dot"></span>
        Đang hoạt động
    </div>

    <!-- GIỚI THIỆU -->
    <div class="bio">
        🎮 Free Fire Player<br>
        ⚡ Gaming • Edit • Design<br>
        🔥 Never Stop Improving
    </div>

    <!-- THỐNG KÊ -->
    <div class="stats">
        <div class="stat">
            <b>99+</b>
            <span>Followers</span>
        </div>

        <div class="stat">
            <b>50+</b>
            <span>Projects</span>
        </div>

        <div class="stat">
            <b>24/7</b>
            <span>Online</span>
        </div>
    </div>

    <!-- LINK -->
    <div class="links">

        <a href="https://www.tiktok.com/" target="_blank">
            🎵 TikTok
        </a>

        <a href="https://www.facebook.com/" target="_blank">
            🔵 Facebook
        </a>

        <a href="#" onclick="copyZalo()">
            💬 Zalo
        </a>

        <a href="#" onclick="copyDiscord()">
            🎮 Discord
        </a>

    </div>

    <footer>
        © 2026 PRX • Personal Profile
    </footer>

</div>

<script>

function copyZalo(){
    navigator.clipboard.writeText("YOUR_ZALO");
    alert("Đã copy Zalo!");
}

function copyDiscord(){
    navigator.clipboard.writeText("YOUR_DISCORD");
    alert("Đã copy Discord!");
}

</script>

</body>
</html>
